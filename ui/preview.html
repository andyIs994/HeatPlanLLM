</style></head><body><main>
<header><a class="brand" href="#">Heat<span>Plan</span></a><span class="edition">SUMMER TABLE · v0.4 EN</span></header>
<div class="hero"><p class="eyebrow">YOUR SUMMER RECIPE COMPANION</p><h1>What would you like to eat?</h1><p>Tell me what you have in mind. We will start with one recipe.</p></div>
<div id="chat-root"></div>
<footer>Suggestions use our recipe collection. This local preview understands common requests; optional Groq support handles broader phrasing.</footer>
</main><script type="module">
/** Food-name screening and transparent ranking, not allergy certification. */
export const HEAT_WEIGHTS={boil:1,steam:1,pan_fry:2,bake:3,grill:3};
export const TEMPERATURE_ORDER={cold:0,room:1,hot:2};
export const RETIRED=['wb-002','wb-019','wb-027'];
export const norm=v=>String(v||'').normalize('NFD').replace(/\p{M}/gu,'').replace(/đ/g,'d').toLowerCase();
export const CUISINES={
  vietnamese:['越南','vietnamese','vietnam','viet nam'],italian:['意大利','意式','italian','italiana','italiano'],
  english:['英格兰','英格蘭','英国菜','english'],indian:['印度','indian'],chinese:['中国菜','中國菜','中餐','中式','chinese'],
  malaysian:['马来西亚','馬來西亞','malaysian'],greek:['希腊','希臘','greek']
};
export const FOOD_TERMS={
  peanut:['花生','peanut','peanuts','arachidi','đậu phộng','lạc'],
  milk:['奶','牛奶','乳制品','milk','dairy','latte','sữa'],egg:['蛋','鸡蛋','egg','eggs','yolk','uova','trứng'],
  wheat:['小麦','麵粉','面粉','wheat','grano','semolina'],soy:['大豆','黄豆','豆腐','soy','soya','tofu','soia'],
  sesame:['芝麻','sesame','sesamo'],fish:['鱼','魚','fish','pesce','anchovy','salmon','catfish'],
  crustacean:['虾蟹','虾','蝦','蟹','虾米','shrimp','shrimps','prawn','prawns','crab','gamberi'],
  mollusc:['软体贝类','贝类','貝類','鱿鱼','squid','clam','mussel','mollusc','mollusk'],
  almond:['杏仁','almond','almonds','mandorle'],cashew:['腰果','cashew','cashews'],
  walnut:['核桃','walnut','walnuts'],pine_nut:['松子','pine nut','pine nuts','pinoli'],
  hazelnut:['榛子','hazelnut','hazelnuts'],pistachio:['开心果','開心果','pistachio','pistachios'],
  macadamia:['夏威夷果','macadamia','macadamias'],brazil_nut:['巴西坚果','brazil nut','brazil nuts'],
  pecan:['碧根果','pecan','pecans'],oats:['燕麦','燕麥','oat','oats'],barley:['大麦','大麥','barley'],
  rye:['黑麦','黑麥','rye'],lupin:['羽扇豆','lupin'],sulphites:['亚硫酸盐','亞硫酸鹽','sulphite','sulphites','sulfite','sulfites'],
  mango:['芒果','mango','mangos','mangoes','xoài'],cucumber:['黄瓜','黃瓜','青瓜','cucumber','cucumbers','cetriolo','dưa chuột'],
  tomato:['番茄','西红柿','西紅柿','tomato','tomatoes','pomodoro','pomodori'],
  coconut:['椰子','椰奶','椰浆','椰漿','椰蓉','coconut','coconuts','cocco'],
  strawberry:['草莓','strawberry','strawberries','fragola','fragole'],kiwi:['猕猴桃','獼猴桃','奇异果','奇異果','kiwi','kiwifruit'],
  pineapple:['菠萝','菠蘿','凤梨','鳳梨','pineapple','ananas'],banana:['香蕉','banana','bananas'],
  lychee:['荔枝','lychee','lychees','litchi'],peach:['桃子','peach','peaches'],apple:['苹果','蘋果','apple','apples'],
  avocado:['牛油果','鳄梨','avocado'],dragon_fruit:['火龙果','火龍果','dragon fruit','pitaya'],
  garlic:['大蒜','蒜','garlic','aglio'],onion:['洋葱','洋蔥','onion','onions','cipolla'],
  chili:['辣椒','chilli','chili','chile','jalapeno','jalapeño'],coriander:['香菜','芫荽','coriander','cilantro','coriandolo'],
  chicken:['鸡肉','雞肉','chicken','pollo'],pork:['猪肉','豬肉','pork','maiale','sausage'],beef:['牛肉','beef','manzo'],
  rice:['米饭','米飯','大米','糯米','rice','riso'],mung_bean:['绿豆','綠豆','mung bean','mung beans'],
  lotus_seed:['莲子','蓮子','lotus seed','lotus seeds'],lily:['百合','lily'],goji:['枸杞','goji','wolfberry'],
  sugar:['糖','砂糖','冰糖','sugar','zucchero']
};
export function contains(text,word){
  text=norm(text);word=norm(word);
  return /[\u3400-\u9fff]/u.test(word)?text.includes(word):new RegExp('(^|[^a-z])'+word+'($|[^a-z])','u').test(text);
}
export const foodLabel=id=>({mung_bean:'mung beans',lotus_seed:'lotus seeds',lily:'lily bulbs',goji:'goji berries',crustacean:'crustaceans',mollusc:'molluscs'}[id]||id.replaceAll('_',' '));
export const extractTerms=text=>Object.entries(FOOD_TERMS).filter(([,a])=>a.some(w=>contains(text,w))).map(([id])=>id);
export function heatLevel(methods){return [...new Set(methods)].reduce((n,m)=>{if(!(m in HEAT_WEIGHTS))throw Error('Unknown heat method');return n+HEAT_WEIGHTS[m];},0);}
const STANDARD=Object.keys(FOOD_TERMS).slice(0,Object.keys(FOOD_TERMS).indexOf('mango'));
export function recipeContains(recipe,id){
  if(recipe.allergen_ids.includes(id))return true;
  // Preserve annotations that distinguish coconut milk from dairy, for example.
  if(STANDARD.includes(id)||!FOOD_TERMS[id])return false;
  const text=recipe.ingredients.concat(recipe.steps).map(b=>b.text).join('\n');
  return FOOD_TERMS[id].some(a=>contains(text,a));
}
export function recommend(records,request={}){
  const out={selected:null,candidates:[],excluded:[],status:'no_match'};
  if(request.retiredRequested||RETIRED.includes(request.recipeId))return {...out,status:'retired',message:"This recipe has been removed from the collection."};
  const invalid=[...(request.unrecognizedAllergens||[]),...(request.allergens||[]).filter(id=>!FOOD_TERMS[id])];
  if(invalid.length)return {...out,status:'needs_clarification',message:"Please clarify the ingredient name or English alias for \""+invalid.join(', ')+"\" here in the chat. I will keep your other preferences."};
  for(const recipe of records){
    let reason;
    if(!recipe.eligible_for_product_prototype||RETIRED.includes(recipe.recipe_id))reason='retired';
    else if(request.recipeId&&recipe.recipe_id!==request.recipeId)reason='different_recipe';
    else if(request.cuisine&&recipe.cuisine_id!==request.cuisine)reason='different_cuisine';
    else if(request.dishType&&recipe.dish_type!==request.dishType)reason='different_dish_type';
    else if(!request.recipeId&&!request.dishType&&!recipe.standalone_dish)reason='component_not_requested';
    else if((request.allergens||[]).some(id=>recipeContains(recipe,id)))reason='allergen_conflict';
    else if((request.excludedIngredients||[]).some(id=>recipeContains(recipe,id)))reason='excluded_ingredient';
    else if(request.allergens?.length&&recipe.unresolved_compound_ingredients.length)reason='compound_label_unverified';
    else if(request.temperature&&recipe.product_temperature!==request.temperature)reason='different_temperature';
    else if(request.avoidHot&&recipe.product_temperature==='hot')reason='avoid_hot';
    else if((request.preferredIngredients||[]).some(id=>!recipeContains(recipe,id)))reason='missing_requested_ingredient';
    else if((request.excludeIds||[]).includes(recipe.recipe_id))reason='already_shown';
    if(reason){out.excluded.push({recipe_id:recipe.recipe_id,reason});continue;}
    const relevance=request.relevanceById?.[recipe.recipe_id]??100;
    if(!Number.isFinite(relevance))throw Error('Invalid relevance');
    const heat=heatLevel(recipe.heating_methods);
    out.candidates.push({recipe,relevance,heat,score:relevance-heat,temperatureRank:TEMPERATURE_ORDER[recipe.product_temperature]});
  }
  out.candidates.sort((a,b)=>a.temperatureRank-b.temperatureRank||b.score-a.score||a.heat-b.heat||a.recipe.recipe_id.localeCompare(b.recipe.recipe_id));
  out.selected=out.candidates[0]||null;out.status=out.selected?'ok':'no_match';return out;
}


export const newConversation=()=>({cuisine:null,temperature:null,dishType:null,allergens:[],excludedIngredients:[],preferredIngredients:[],unrecognizedAllergens:[],shownIds:[],recipeId:null,lastRecipeId:null,avoidHot:false,turn:0});
const uniq=a=>[...new Set(a)];
const TEMP={cold:"Cold / chilled",room:"Room temperature",hot:"Hot"};
const CUISINE_LABEL={vietnamese:"Vietnamese",italian:"Italian",english:"English",indian:"Indian",chinese:"Chinese",malaysian:"Malaysian",greek:"Greek"};
const TYPE_LABEL={main:"Main dish",side:"Side dish",salad:"Salad",dessert:"Dessert",beverage:"Drink",sauce:"Sauce",base:"Base ingredient"};
const TREE_NUTS=['almond','brazil_nut','cashew','hazelnut','macadamia','pecan','pistachio','pine_nut','walnut'];
function parseFoodList(text){
  let value=norm(text).trim();
  const broadNuts=/坚果|堅果|\bnuts?\b/u.test(value)&&!/\b(pine|brazil) nuts?\b/u.test(value);
  const ids=extractTerms(value);
  if(broadNuts){ids.push(...TREE_NUTS,'peanut');value=value.replace(/坚果|堅果|\bnuts?\b/gu,'');}
  for(const id of ids)for(const alias of [...FOOD_TERMS[id]].sort((a,b)=>b.length-a.length)){
    const a=norm(alias);
    if(/[\u3400-\u9fff]/u.test(a))value=value.replaceAll(a,'');
    else value=value.replace(new RegExp('(^|[^a-z])'+a+'(?=$|[^a-z])','gu'),'$1');
  }
  const unknown=value.replace(/我|本人|有|对|對|过敏原|過敏原|过敏|過敏|是|严重|嚴重|只有|还有|還有|以及|和|或者|也|都|的|一点|一點|allergic to|allergy to|allergens?|\ballergy\b|allergies|i am|i'm|sono allergico a|sono allergica a|di ung|\band\b|\bor\b/gu,'')
    .replace(/[\s,，;；、：:。.?!！？()（）/+&]/gu,'').trim();
  return {ids:uniq(ids),unknown:unknown?[unknown]:[]};
}
export function parseTurn(text,previous=newConversation(),records=[]){
  const value=norm(text),patch={allergensAdd:[],allergensRemove:[],excludedAdd:[],preferred:[],unknown:[]};
  patch.reset=/^(重新开始|重新开始对话|新对话|新话题|清空对话|reset|new chat)$/u.test(value.trim());
  patch.another=/换一道|换一个|再来一道|还有别的|另一道|\banother\b|something else|different (?:recipe|dish)|un altro/u.test(value);
  patch.why=/为什么|為什麼|怎么推荐|why|perche/u.test(value);
  for(const [id,aliases] of Object.entries(CUISINES))if(aliases.some(a=>contains(value,a)))patch.cuisine=id;
  if(/菜系不限|不限菜系|什么菜系都行|any cuisine/u.test(value))patch.cuisine=null;
  if(/冷热不限|冷熱不限|冷热都行|都可以|any temperature/u.test(value))patch.temperature=null;
  else if(/常温|常溫|room temperature|temperatura ambiente/u.test(value))patch.temperature='room';
  else if(/不要热|不要熱|不吃热|不吃熱|not hot|(?:do not|don't) want (?:anything )?hot/u.test(value))patch.avoidHot=true;
  else if(/(?:^|[，,;；\s])(?:热|熱)(?:$|[，,;；\s])|热食|热菜|熱食|熱菜|热的|熱的|(?:^|[,;]\s*)hot$|make it hot|serve it hot|something hot|hot food|hot meal|hot dish|cibo caldo|mon nong/u.test(value))patch.temperature='hot';
  else if(/(?:^|[，,;；\s])(?:冷|冰)(?:$|[，,;；\s])|冰食|冰饮|冰飲|冷食|冷菜|凉菜|涼菜|冷的|冰的|凉的|涼的|\bcold\b|\biced\b|cibo freddo|mon lanh/u.test(value))patch.temperature='cold';
  if(/甜点|甜品|甜點|dessert|dolce/u.test(value))patch.dishType='dessert';
  else if(/饮品|飲品|饮料|飲料|冰饮|冰飲|\bdrink\b|beverage/u.test(value))patch.dishType='beverage';
  else if(/沙拉|salad|insalata/u.test(value))patch.dishType='salad';
  else if(/主菜|main dish/u.test(value))patch.dishType='main';
  else if(/酱汁|醬汁|\bsauce\b/u.test(value))patch.dishType='sauce';
  if(/类型不限|類型不限|不要限制类型|any dish type/u.test(value))patch.dishType=null;
  for(const clause of value.split(/[，,;；。!?！？]/u)){
    const allergy=/过敏|過敏|allerg|di ung/u.test(clause);
    if(allergy){
      const isRemoval=/不过敏|不過敏|没有.*过敏|沒有.*過敏|去掉.*过敏限制|取消.*过敏限制|not allergic/u.test(clause);
      const found=clause.match(/(?:对|對)(.+?)(?:不?过敏|不?過敏)/u)||clause.match(/(?:allergic to|allergy to|di ung|allergico a|allergica a)\s*(.+)/u);
      let food=found?.[1]||clause.replace(/(?:我|本人)?(?:的)?过敏原(?:是|有|为|為|:|：)?/u,'').replace(/(?:不?过敏|不?過敏).*$/u,'').replace(/^.*(?:只有|还有|還有)/u,'');
      const p=parseFoodList(food);
      if(isRemoval)patch.allergensRemove.push(...p.ids);
      else {patch.allergensAdd.push(...p.ids);patch.unknown.push(...p.unknown);if(!p.ids.length&&!p.unknown.length)patch.unknown.push("an unnamed allergen");}
      continue;
    }
    if(/不要|不吃|不加|去掉|without|\bavoid\b|\bno\s+(?:mango|peanuts?|milk|eggs?|sesame|soy)\b|senza/u.test(clause)){
      const terms=extractTerms(clause);
      patch.excludedAdd.push(...terms);
      if(/不要辣|不吃辣/u.test(clause))patch.excludedAdd.push('chili');
    }else if(/有|用|加入|加点|加點|想吃|\bhave\b|\binclude\b|with|using/u.test(clause)){
      patch.preferred.push(...extractTerms(clause));
    }
  }
  if(previous.unrecognizedAllergens?.length&&!/过敏|過敏|allerg|di ung/u.test(value)){
    const p=parseFoodList(value);
    if(p.ids.length&&!p.unknown.length){patch.allergensAdd.push(...p.ids);patch.resolvePending=true;}
  }
  if(/不限制食材|食材不限|any ingredients|no ingredient preference/u.test(value)){patch.preferred=[];patch.clearPreferred=true;}
  if(/不限制忌口|取消忌口/u.test(value))patch.clearExclusions=true;
  for(const r of records){
    const name=norm(r.title.replace(/\s*\([^)]*\)/gu,'').trim());
    if(name.length>2&&value.includes(name))patch.recipeId=r.recipe_id;
  }
  for(const [alias,id] of Object.entries({'nuoc mam':'wb-014','egg soda':'wb-007','cao lau':'wb-005','bo bia':'wb-003','banh mi':'wb-001','banh chung':'wb-002','minestrone alla capucina':'wb-027','pasta marinata':'wb-019'})){
    if(value.includes(alias))patch.recipeId=id;
  }
  // Intents requiring a real reformulation must not silently return an unchanged recipe.
  patch.reformulation=/少糖|减糖|減糖|无糖|無糖|换成.*奶|替换|替換|改成.*烤|改成.*煮|less sugar|sugar.free|replace|vegan|纯素|純素/u.test(value);
  return patch;
}
export function conditionLabels(state){
  const out=[];
  if(state.cuisine)out.push(CUISINE_LABEL[state.cuisine]);
  out.push(state.temperature?TEMP[state.temperature]:(state.avoidHot?"Cold / room temperature":"Cold dishes first"));
  if(state.dishType)out.push(TYPE_LABEL[state.dishType]);
  if(state.allergens.length)out.push("Allergies: "+state.allergens.map(foodLabel).join(', '));
  if(state.excludedIngredients.length)out.push("Avoid: "+state.excludedIngredients.map(foodLabel).join(', '));
  if(state.preferredIngredients.length)out.push("Include: "+state.preferredIngredients.map(foodLabel).join(', '));
  return out;
}
export function handleTurn(text,previous,records,modelPatch=null){
  if(typeof text!=='string'||!text.trim()||text.length>4000)throw Error("Please send a message between 1 and 4,000 characters.");
  let state=structuredClone(previous||newConversation());
  const p=parseTurn(text,state,records);
  if(p.reset)return {state:newConversation(),status:'reset',reply:"A new chat has started. Tell me what you would like to eat, your serving-temperature preference and any allergies.",selected:null,conditions:[],allergyNote:"Please mention any allergies in the chat."};
  // Model fills interpreted preferences; local explicit preferences win. Allergy terms only accumulate.
  if(modelPatch){
    for(const k of ['cuisine','temperature','dishType'])if(p[k]===undefined&&modelPatch[k])p[k]=modelPatch[k];
    for(const term of modelPatch.allergy_terms||[]){
      const parsed=parseFoodList(term);p.allergensAdd.push(...parsed.ids);p.unknown.push(...parsed.unknown);
    }
    for(const term of modelPatch.exclude_terms||[])p.excludedAdd.push(...extractTerms(term));
    for(const term of modelPatch.prefer_terms||[])p.preferred.push(...extractTerms(term));
    p.another ||= modelPatch.wants_another===true;
  }
  const hasChangedPreferences=['cuisine','temperature','dishType'].some(k=>p[k]!==undefined&&p[k]!==state[k])||p.preferred.length>0;
  if(hasChangedPreferences){state.shownIds=[];state.recipeId=null;}
  for(const k of ['cuisine','temperature','dishType'])if(p[k]!==undefined)state[k]=p[k];
  if(p.temperature!==undefined)state.avoidHot=false;

  state.allergens=uniq([...state.allergens,...p.allergensAdd]).filter(id=>!p.allergensRemove.includes(id));

  const allergyNote=(state.allergens.length?"Recipes with identified conflicts have been excluded for: "+state.allergens.map(foodLabel).join(', ')+". ":"Please mention any allergies as we chat. ")+"Check ingredient and seasoning labels and possible cross-contact; no detected conflict is not a guarantee of allergy safety.";
  const base={state,conditions,allergyNote,selected:null,excluded:[],candidates:[]};

  if(p.why&&state.lastRecipeId){

    if(r)return {...base,status:'explanation',reply:"The previous recommendation used "+conditions.join('; ')+", then serving temperature and cooking heat. "+r.standard_recipe_label+" is served "+r.temperature_label+", with cooking heat "+r.heat_level+" and a score within its temperature group of "+r.heat_score_at_full_relevance+'.'};
  }
  if(state.turn===1&&!p.cuisine&&!p.temperature&&!p.dishType&&!p.recipeId&&!p.allergensAdd.length&&!p.preferred.length&&!p.unknown.length&&!p.excludedAdd.length&&!modelPatch){

    const reply=result.message||(p.another?"There are no more standard recipes matching these preferences. Try \"Make it room temperature\" or \"Any cuisine\"; I will keep your allergy restrictions.":"The collection has no standard recipe matching all these preferences. Change the temperature, cuisine or dish type here; I will keep your allergy restrictions.");

}


function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
export function mountChat(host,{records,endpoint='/api/chat'}){
  let state=newConversation(),busy=false,disposed=false,apiAvailable=false;

  const reset=node('button',"New chat",'reset');reset.type='button';top.append(label,reset);
  const messages=node('div',undefined,'messages');messages.setAttribute('role','log');messages.setAttribute('aria-live','polite');messages.setAttribute('aria-label',"Recipe conversation");
  const context=node('div',undefined,'context');context.setAttribute('aria-label',"Current preferences");
  const form=node('form',undefined,'composer');

  const send=node('button',"Send",'send');send.type='submit';
  const help=node('p',"Try: \"Chinese food, mango allergy, cold.\" Then \"Another one\" or \"Make it room temperature.\"",'composer-help');help.id='chat-help';
  form.append(input,send);
  host.append(top,messages,context,form,help);
  const welcome=()=>{const row=node('section',undefined,'message assistant welcome');row.append(node('span','HeatPlan','speaker'),node('p',"Tell me what you would like to eat. Include your preferred cuisine, serving temperature, ingredients and any allergies in one message."),node('p',"Keep chatting — I will remember your preferences during this conversation.",'muted'));messages.append(row);};
  welcome();
  function renderResult(result){
    const row=node('section',undefined,'message assistant');row.dataset.status=result.status;
    row.append(node('span','HeatPlan','speaker'),node('p',result.reply,'reply'));
    if(result.selected){
      const {recipe:r,score,heat}=result.selected;
      const card=node('article',undefined,'recipe-card');card.dataset.recipeId=r.recipe_id;

      ing.append(node('h3',"Ingredients"));const ul=node('ul');for(const b of r.ingredients)ul.append(node('li',(b.source_group?'['+b.source_group+'] ':'')+b.text));ing.append(ul);
      steps.append(node('h3',"Method"));const ol=node('ol');for(const b of r.steps)ol.append(node('li',b.text));steps.append(ol);

      card.append(node('p',r.allergen_reminder,'allergy'));
      for(const note of r.food_notes)card.append(node('p',note,'food-note'));

      const explain=node('details',undefined,'explanation');explain.append(node('summary',"Why this recipe?"));
      explain.append(node('p',"Preferences: "+result.conditions.join('; ')+'.'));
      explain.append(node('p',r.temperature_label+" group; "+(r.heat_breakdown.map(m=>m.label+' +'+m.weight).join(', ')||"No active cooking heat +0")+"; cooking heat "+heat+", score within this temperature group "+score+'.'));
      explain.append(node('p',"Allergy and ingredient restrictions are applied first, followed by cold, room-temperature and hot groups, then cooking heat."));
      card.append(explain);row.append(card);
    }
    row.append(node('p',result.allergyNote,'allergy-followup'));
    messages.append(row);context.replaceChildren(...result.conditions.map(c=>node('span',c,'condition')));
    row.scrollIntoView({behavior:'smooth',block:'start'});
  }
  async function submit(event){
    event.preventDefault();const text=input.value.trim();if(!text||busy)return;
    busy=true;send.disabled=true;send.textContent="Replying…";input.disabled=true;
    const own=node('section',undefined,'message user');own.append(node('span',"You",'speaker'),node('p',text));messages.append(own);input.value='';
    try{
      let result;
      if(apiAvailable){
        try{
          const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,state}),signal:controller.signal});
          if(!response.ok)throw Error('Service unavailable');
          result=await response.json();
          label.textContent=result.mode==='groq'?"Groq-assisted chat":result.fallback?"Local chat · model unavailable":"Local chat preview";
        }catch(error){
          if(disposed)return;
          result=handleTurn(text,state,records);label.textContent="Local chat · service unavailable";
        }
      }else result=handleTurn(text,state,records);
      if(disposed)return;
      state=result.state;renderResult(result);
    }catch(error){
      if(!disposed)messages.append(node('p',"I could not process that message. Please try again; your confirmed preferences are still saved.",'error'));

  reset.addEventListener('click',()=>{if(busy)return;state=newConversation();messages.replaceChildren();context.replaceChildren();input.value='';welcome();input.focus();});

    if(!disposed&&status?.app==='heatplan-chat-en'){apiAvailable=true;label.textContent=status.groq_configured?"Groq-assisted chat":"Local chat preview";}
  }).catch(()=>{});
  return ()=>{disposed=true;controller.abort();host.replaceChildren();};
}

":"Broth","changed":false},{"text":"Sugar","source_index":8,"source_group":"Broth","changed":false},{"text":"Red pigment powder (non-spicy, just for coloring)","source_index":9,"source_group":"Broth","changed":false},{"text":"Chilli powder","source_index":10,"source_group":"Broth","changed":false},{"text":"1 bunch of cilantro leaves, chopped","source_index":11,"source_group":"Assembly","changed":false},{"text":"1 bunch of Italian (flat leaf) parsley leaves, chopped","source_index":12,"source_group":"Assembly","changed":false},{"text":"1 medium onion, finely chopped","source_index":13,"source_group":"Assembly","changed":false},{"text":"1 kg thin rice noodles","source_index":14,"source_group":"Assembly","changed":false},{"text":"Limes, cut into wedges","source_index":15,"source_group":"Condiments","changed":false},{"text":"Fresh chilli peppers, sliced","source_index":16,"source_group":"Condiments","changed":false},{"text":"Bean sprouts","source_index":17,"source_group":"Condiments","changed":false},{"text":"Banana blossom, thinly sliced","source_index":18,"source_group":"Condiments","changed":false},{"text":"Shrimp paste","source_index":19,"source_group":"Condiments","changed":false}],"steps":[{"text":"Add the shrimp paste to a large 2.5 L bowl, and gradually mix in cold water while vigorously stirring the paste. Keep adding water and stirring until you’ve almost reached the rim of the bowl. Don’t let it spill over. Let the paste mixture rest in the bowl for 1.5 hours to allow the mixture to settle.","source_index":1,"source_group":"Broth","changed":false},{"text":"Sauté the small onion in 3 tbsp oil until golden brown.","source_index":2,"source_group":"Broth","changed":false},{"text":"In a stockpot, combine the cooked onion and pig feet with 2 L water. Slowly bring it to the boil over medium heat.","source_index":3,"source_group":"Broth","changed":false},{"text":"Add lemongrass, then slowly and carefully pour in the shrimp paste mixture, making sure to only add the clear liquid and not the silt that has settled at the bottom of the bowl.","source_index":4,"source_group":"Broth","changed":false},{"text":"To the residual shrimp paste, add another litre of water and stir. Again, wait until the mixture has settled before adding it into the stockpot.","source_index":5,"source_group":"Broth","changed":false},{"text":"Simmer the stock for 20 minutes.","source_index":6,"source_group":"Broth","changed":false},{"text":"Add the beef and occasionally skim the broth to ensure you get a nice clear liquid. Cook for another 20 minutes, checking the beef to be sure it’s not overcooked.","source_index":7,"source_group":"Broth","changed":false},{"text":"Add fish sauce and sugar to taste to achieve a nice balance between salty and sweet.","source_index":8,"source_group":"Broth","changed":false},{"text":"While the broth is cooking, heat some oil in a pan and add the red pigment. Cook until the pigment is blended with the oil. Add to the stock. Repeat the process with the chilli powder.","source_index":9,"source_group":"Broth","changed":false},{"text":"Combine chopped parsley and cilantro leaves with the uncooked medium onion.","source_index":10,"source_group":"Assembly","changed":false},{"text":"If you are using fresh noodles, simply add boiling water to heat them up. If you’re using dried noodles, soak them in boiling water until they are soft then dip in cold water to stop the cooking process. Do not over cook them or you’ll have mush. Dried noodles have already been cooked.","source_index":11,"source_group":"Assembly","changed":false},{"text":"In a large soup bowl, place a handful of noodles, top with a handful of the parsley/cilantro/onion mixture, and ladle on generous amounts of steaming hot broth, ensuring there are several pieces of beef and pork.","source_index":12,"source_group":"Assembly","changed":false},{"text":"Serve hot with the condiments. You can add a squeeze of lime and chopped fresh chillies if you like your food extra spicy. It anged":false},{"text":"Add the wine. A hot pan will cause the alcohol to evaporate more quickly (and create a nice dramatic effect), but make sure you don't burn the rice or the soffritto.","source_index":3,"source_group":null,"changed":false},{"text":"As the wine cooks away you will see the remaining liquid getting thicker as it's absorbing the starch from the rice. When it's more or less gone, add some stock. Do not add too much stock. The rice should never be submerged in stock. Keep stirring it and keep adding more stock as it cooks away. This should take about 15–20 minutes.","source_index":4,"source_group":null,"changed":false},{"text":"Taste to see if the rice is done. The rice should be soft, but have enough bite to it to feel the individual grains of rice. The choice between a liquid risotto or a firmer one is a matter of personal preference. When put on a plate, it should spread out slowly. If it sits still, it needs some more stock; if there's liquid coming from the risotto, it needs to cook down a bit more.","source_index":5,"source_group":null,"changed":false},{"text":"Let it rest for about a minute once ready.","source_index":6,"source_group":null,"changed":false},{"text":"Vigorously stir in the butter in small chunks at the time, tasting to get the amount of butter right. Season with more salt and pepper to taste. This phase is called the mantecatura.","source_index":7,"source_group":null,"changed":false},{"text":"Serve immediately.","source_index":8,"source_group":null,"changed":false}],"servings_raw":"4 persons","total_time_raw":"40 minutes","product_temperature":"hot","temperature_label":"Hot","temperature_basis":"assistant_product_default_under_user_calibration","source_temperature_annotation":"unspecified","heating_methods":["boil","pan_fry"],"heat_level":3,"heat_breakdown":[{"method":"boil","label":"Boiling / simmering / poaching","weight":1},{"method":"pan_fry","label":"Pan-frying / stir-frying / dry-toasting","weight":2}],"heat_score_at_full_r _group":"Ingredients","changed":false,"source_text":"胡萝卜半根"},{"text":"⅓ purple cabbage","source_index":4,"source_group":"Ingredients","changed":false,"source_text":"紫甘蓝1/3个"},{"text":"50 g chicken breast","source_index":5,"source_group":"Ingredients","changed":true,"source_text":"鸡胸肉50克"},{"text":"1 tbsp sesame paste (about 15 g)","source_index":6,"source_group":"Seasonings","changed":false,"source_text":"芝麻酱1汤匙（约15克）"},{"text":"⅓ tsp salt (about 2 g)","source_index":7,"source_group":"Seasonings","changed":false,"source_text":"盐1/3茶匙（约2克）"},{"text":"3 tsp rice vinegar (about 15 ml)","source_index":8,"source_group":"Seasonings","changed":false,"source_text":"米醋3茶匙（约15毫升）"},{"text":"2 tsp light soy sauce (about 10 ml)","source_index":9,"source_group":"Seasonings","changed":false,"source_text":"生抽2茶匙（约10毫升）"},{"text":"½ tsp sugar (about 3 g)","source_index":10,"source_group":"Seasonings","changed":false,"source_text":"糖1/2茶匙（约3克）"},{"text":"1 tbsp water (about 15 ml)","source_index":11,"source_group":"Seasonings","changed":false,"source_text":"纯净水1汤匙（约15毫升）"},{"text":"Green wasabi-style paste, a mung-bean-sized amount","source_index":12,"source_group":"Seasonings","changed":false,"source_text":"青芥辣（绿豆粒大小）"},{"text":"½ tsp cooking wine (about 3 ml)","source_index":13,"source_group":"Seasonings","changed":false,"source_text":"料酒1/2茶匙（约3毫升）"},{"text":"¼ tsp starch (about 1 g)","source_index":14,"source_group":"Seasonings","changed":false,"source_text":"干淀粉1/4茶匙（约1克）"},{"text":"¼ tsp white pepper (about 1 g)","source_index":15,"source_group":"Seasonings","changed":true,"source_text":"白胡椒粉1/4茶匙（约1克）"},{"text":"A little cooking oil, for stir-frying the chicken","source_index":null,"changed":true,"source_text":"食用油，少量，用于炒鸡肉"}],"steps":[{"text":"Tear the purple cabbage into large pieces and wash. Soak in lightly salted water for 5 minutes, drain, then cut into fine shreds about 4 cm long.","source_index":1,"source_group":null,"changed":false,"source_text":"将紫甘蓝撕成大片清洗干净后，放入淡盐水中
